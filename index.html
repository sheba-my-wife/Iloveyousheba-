<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I LOVE YOU SHEBA</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 45%, #1a0612 0%, #070107 55%, #000 100%); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas.drag { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="c" aria-label="Rotating 3D heart made of the words I LOVE YOU SHEBA"></canvas>

<script>
(function () {
  // each token is one slot along the heart; the emoji is one token
  const TOKENS = [..."I LOVE YOU SHEBA".split(""), " ", "\u2764\uFE0F", " ", " ", " "];
  const COLOR = "#ea80b0";
  const LAYERS = 7;
  const BUCKETS = 20;

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1;

  // ---- heart curve ----
  const N = 1200;
  const pts = [];
  (function () {
    const raw = [];
    for (let i = 0; i <= N; i++) {
      const t = (i / N) * Math.PI * 2;
      raw.push({
        x: 16 * Math.pow(Math.sin(t), 3),
        y: 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
      });
    }
    let s = 0;
    for (let i = 0; i <= N; i++) {
      const a = raw[Math.max(0, i - 1)], b = raw[Math.min(N, i + 1)];
      let tx = b.x - a.x, ty = b.y - a.y;
      const l = Math.hypot(tx, ty) || 1;
      if (i > 0) s += Math.hypot(raw[i].x - raw[i - 1].x, raw[i].y - raw[i - 1].y);
      pts.push({ x: raw[i].x, y: raw[i].y, tx: tx / l, ty: ty / l, s });
    }
  })();
  const TOTAL = pts[N].s;

  function pointAt(s) {
    s = ((s % TOTAL) + TOTAL) % TOTAL;
    let lo = 0, hi = N;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (pts[m].s <= s) lo = m; else hi = m; }
    const a = pts[lo], b = pts[hi], k = (s - a.s) / ((b.s - a.s) || 1);
    return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, tx: a.tx + (b.tx - a.tx) * k, ty: a.ty + (b.ty - a.ty) * k };
  }

  // ---- preallocated per-glyph data ----
  let M = 0, unit = 10, fontPx = 13;
  let gx, gy, gz, gtx, gty, gch;
  let sx, sy, sc, ss, sf, sl, sb, order;
  const counts = new Int32Array(BUCKETS + 1);
  let sprites = {};   // char -> {cv, w, h}

  function buildSprites() {
    sprites = {};
    const font = `${Math.round(fontPx * DPR)}px "Courier New", ui-monospace, monospace`;
    const chars = Array.from(new Set(TOKENS.filter(t => t !== " ")));
    const pad = Math.ceil(7 * DPR);
    ctx.font = font;
    for (const ch of chars) {
      const tw = Math.ceil(ctx.measureText(ch).width);
      const w = tw + pad * 2, h = Math.ceil(fontPx * DPR * 1.3) + pad * 2;
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const c = cv.getContext("2d");
      c.font = font; c.textAlign = "center"; c.textBaseline = "middle";
      c.fillStyle = COLOR;
      c.shadowColor = "rgba(255,255,255,0.85)";
      c.shadowBlur = 6 * DPR;
      c.fillText(ch, w / 2, h / 2);
      sprites[ch] = { cv, w, h };
    }
  }

  function layout() {
    unit = Math.min(W, H * 0.9) / 40;
    fontPx = Math.max(9, unit * 1.25);
    buildSprites();
    ctx.font = `${fontPx}px "Courier New", ui-monospace, monospace`;
    const adv = ctx.measureText("m").width / unit;
    const count = Math.round(TOTAL / adv);
    const step = TOTAL / count;
    const zGap = (fontPx * 0.95) / unit;
    const list = [];
    for (let j = 0; j < LAYERS; j++) {
      const z = (j - (LAYERS - 1) / 2) * zGap;
      const shift = Math.round(j * 1.7);
      for (let k = 0; k < count; k++) {
        const ch = TOKENS[(k + shift) % TOKENS.length];
        if (ch === " ") continue;
        const p = pointAt(k * step);
        list.push([ch, p.x, p.y, z, p.tx, p.ty]);
      }
    }
    M = list.length;
    gx = new Float32Array(M); gy = new Float32Array(M); gz = new Float32Array(M);
    gtx = new Float32Array(M); gty = new Float32Array(M); gch = new Array(M);
    for (let i = 0; i < M; i++) {
      const g = list[i];
      gch[i] = g[0]; gx[i] = g[1]; gy[i] = g[2]; gz[i] = g[3]; gtx[i] = g[4]; gty[i] = g[5];
    }
    sx = new Float32Array(M); sy = new Float32Array(M);
    sc = new Float32Array(M); ss = new Float32Array(M);
    sf = new Float32Array(M); sl = new Float32Array(M);
    sb = new Int16Array(M); order = new Int32Array(M);
  }

  // ---- stars ----
  const stars = [];
  for (let i = 0; i < 40; i++) stars.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + 0.5, p: Math.random() * 6.28, sp: 0.5 + Math.random() * 1.5 });

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    layout();
  }
  window.addEventListener("resize", resize);

  // ---- interaction: drag = rotate, wheel / pinch = zoom, double-tap = reset ----
  let zoom = 1;
  let userYaw = 0, userPitch = 0;
  const ZMIN = 0.5, ZMAX = 3.5;
  const clampZoom = z => Math.max(ZMIN, Math.min(ZMAX, z));
  const ptrs = new Map();
  let lastX = 0, lastY = 0, pinchDist = 0;

  canvas.addEventListener("pointerdown", e => {
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add("drag");
    lastX = e.clientX; lastY = e.clientY;
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    }
  });
  canvas.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size >= 2) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchDist > 0) zoom = clampZoom(zoom * d / pinchDist);
      pinchDist = d;
    } else {
      userYaw += (e.clientX - lastX) * 0.01;
      userPitch = Math.max(-0.9, Math.min(0.9, userPitch + (e.clientY - lastY) * 0.006));
    }
    lastX = e.clientX; lastY = e.clientY;
  });
  const endPtr = e => {
    ptrs.delete(e.pointerId);
    pinchDist = 0;
    if (ptrs.size === 1) { const p = [...ptrs.values()][0]; lastX = p.x; lastY = p.y; }
    if (ptrs.size === 0) canvas.classList.remove("drag");
  };
  canvas.addEventListener("pointerup", endPtr);
  canvas.addEventListener("pointercancel", endPtr);
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    zoom = clampZoom(zoom * Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });
  canvas.addEventListener("dblclick", () => { zoom = 1; userYaw = 0; userPitch = 0; });
  window.addEventListener("keydown", e => {
    if (e.key === "+" || e.key === "=") zoom = clampZoom(zoom * 1.15);
    else if (e.key === "-") zoom = clampZoom(zoom / 1.15);
    else if (e.key === "0") zoom = 1;
  });

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const CAM = 70, ZR = 22;

  function frame(ms) {
    const t = ms / 1000;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ffd6e8";
    for (const s of stars) {
      ctx.globalAlpha = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * s.sp + s.p));
      ctx.fillRect(s.x * canvas.width, s.y * canvas.height, s.r * DPR, s.r * DPR);
    }

    const yaw = (reduceMotion ? 0.5 : Math.sin(t * 0.63) * 1.05) + userYaw;
    const pitch = -0.28 + Math.sin(t * 0.4) * 0.06 + userPitch;
    const cyw = Math.cos(yaw), syw = Math.sin(yaw), cpt = Math.cos(pitch), spt = Math.sin(pitch);
    const beat = reduceMotion ? 1 : 1 + 0.045 * Math.pow(Math.max(0, Math.sin(t * 2.4)), 6) + 0.02 * Math.pow(Math.max(0, Math.sin(t * 2.4 - 0.6)), 6);
    const k = unit * beat * zoom;
    const cx = W / 2, cy = H / 2 + unit * 0.5;

    counts.fill(0);
    for (let i = 0; i < M; i++) {
      const x = gx[i], y = gy[i], z = gz[i];
      const x1 = x * cyw + z * syw;
      const z1 = -x * syw + z * cyw;
      const y2 = y * cpt - z1 * spt;
      const z2 = y * spt + z1 * cpt;
      const f = CAM / (CAM - z2);
      const tx1 = gtx[i] * cyw, tz1 = -gtx[i] * syw;
      const ty2 = gty[i] * cpt - tz1 * spt;
      const px = tx1 * f, py = -ty2 * f;
      const len = Math.sqrt(px * px + py * py);
      if (len < 0.08) { sb[i] = -1; continue; }
      sx[i] = (cx + x1 * f * k) * DPR;
      sy[i] = (cy - y2 * f * k) * DPR;
      sc[i] = px / len; ss[i] = py / len;
      sf[i] = f * zoom; sl[i] = Math.min(1, len / f);
      let b = ((z2 + ZR) / (ZR * 2) * BUCKETS) | 0;
      b = b < 0 ? 0 : b >= BUCKETS ? BUCKETS - 1 : b;
      sb[i] = b; counts[b + 1]++;
    }
    for (let b = 0; b < BUCKETS; b++) counts[b + 1] += counts[b];
    for (let i = 0; i < M; i++) { const b = sb[i]; if (b >= 0) order[counts[b]++] = i; }

    // draw back to front, alpha set once per depth bucket
    let total = 0;
    for (let i = 0; i < M; i++) if (sb[i] >= 0) total++;
    let cur = -1;
    for (let j = 0; j < total; j++) {
      const i = order[j];
      const b = sb[i];
      if (b !== cur) { cur = b; ctx.globalAlpha = 0.28 + 0.72 * (b / (BUCKETS - 1)); }
      const sp = sprites[gch[i]];
      const f = sf[i], c = sc[i], s = ss[i], l = sl[i];
      ctx.setTransform(c * l * f, s * l * f, -s * f, c * f, sx[i], sy[i]);
      ctx.drawImage(sp.cv, -sp.w / 2, -sp.h / 2);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
